# All slots use OpenRouter's free pool — no fixed vendor/model name; OpenRouter picks a free model per request.
# Docs: https://openrouter.ai/docs/guides/routing/routers/free-models-router
models:
  main:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 16384
    max_output: 4096
    api_key: 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
  fast:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 8192
    max_output: 2048
    api_key: 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
  opus:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 16384
    max_output: 4096
    api_key: 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

router:
  model: fast
  categories:
    - simple
    - coding
    - ebs
    - system

tools:
  bash:
    enabled: true
    timeout: 120
  ssh_remote:
    enabled: true
    timeout: 120
  file_ops:
    enabled: true
    allowed_dirs:
      - /opt
      - /home
      - /root
      - /tmp
      - /var
      - /etc
  git:
    enabled: true
  oracle:
    enabled: true
    default_connection: dev
    connections:
      prod:
        label: "Production EBS"
        hostname: ""
        host: ""
        port: "1521"
        service: ""
        username: ""
        password: ""
      dev:
        label: "Dev/Test EBS"
        hostname: ""
        host: ""
        port: "1521"
        service: ""
        username: ""
        password: ""
  web:
    enabled: true
  ebs:
    enabled: true

skills_dir: /opt/codeagent/skills/library

web:
  host: 0.0.0.0
  port: 4200

permissions:
  bash: allow
  file_write: allow
  file_read: allow
  oracle_query: allow
  dangerous_commands: ask

session:
  dir: /opt/codeagent/sessions
  # Lower = faster prefill per turn. Raise if long threads lose context.
  max_history_tokens: 2048

agent:
  max_iterations: 4
  repeat_penalty: 1.15
  temperature: 0.2
  top_p: 0.9
