# Example configuration — DO NOT paste real secrets here.
# Deploy: cp config.example.yaml /opt/codeagent/config.yaml  (then fill env vars below)
#
# Resolved env syntax: api_key entries like "${OPENROUTER_API_KEY}" are expanded from the process environment at runtime.

models:
  main:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 16384
    max_output: 4096
    api_key: ${OPENROUTER_API_KEY}

  fast:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 8192
    max_output: 2048
    api_key: ${OPENROUTER_API_KEY}

  opus:
    url: https://openrouter.ai/api/v1
    name: openrouter/free
    ctx_size: 16384
    max_output: 4096
    api_key: ${OPENROUTER_API_KEY}

router:
  model: fast
  categories:
    - simple
    - coding
    - ebs
    - system

tools:
  bash:
    enabled: true
    timeout: 120
  ssh_remote:
    enabled: true
    timeout: 120
  file_ops:
    enabled: true
    allowed_dirs:
      - /opt
      - /home
      - /root
      - /tmp
      - /var
      - /etc
  git:
    enabled: true
  oracle:
    enabled: true
    default_connection: dev
    connections:
      prod:
        label: "Production EBS"
        hostname: ""
        host: ""
        port: "1521"
        service: ""
        username: ""
        password: ""
      dev:
        label: "Dev/Test EBS"
        hostname: ""
        host: ""
        port: "1521"
        service: ""
        username: ""
        password: ""
  web:
    enabled: true
  ebs:
    enabled: true
  pollinations:
    # Optional override; Pollinations Bearer key reads POLLINATIONS_API_KEY first anyway.
    api_key: ${POLLINATIONS_API_KEY}
    base_url: https://gen.pollinations.ai
  analyze_image:
    enabled: true
    # Optional OpenRouter vision-capable model id; blank inherits models.main.name
    model: ""
    prefer: main  # "main" or "fast" — which slot supplies API URL + key template
    max_bytes: 12582912
    timeout: 120

skills_dir: /opt/codeagent/skills/library

web:
  host: 0.0.0.0
  port: 4200

permissions:
  bash: allow
  file_write: allow
  file_read: allow
  oracle_query: allow
  dangerous_commands: ask

session:
  dir: /opt/codeagent/sessions
  max_history_tokens: 2048

agent:
  max_iterations: 4
  repeat_penalty: 1.15
  temperature: 0.2
  top_p: 0.9
